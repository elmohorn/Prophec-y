name: Validate arpeggiator
on:
  push:
    branches: [work/arp-development-checkpoint]
permissions:
  contents: read
jobs:
  plugin:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfontconfig1-dev libfreetype6-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxi-dev libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev libegl1-mesa-dev xvfb
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DP6_BUILD_PLUGIN=ON -DP6_FETCH_JUCE=ON -DP6_BUILD_UI_SMOKE=ON
      - name: Build
        run: cmake --build build --config Release --target P6UiSmoke P6CorePlugin_VST3 p6_arp_character_tests p6_arp_state_tests p6core_tests p6_plugin_state_tests p6_realtime_contract_tests p6_state_compatibility_tests p6_output_stage_tests --parallel 2
      - name: Core and state tests
        run: ctest --test-dir build -C Release --output-on-failure -R "^(p6_arp_character_tests|p6_arp_state_tests|p6core_tests|p6_plugin_state_tests|p6_realtime_contract_tests|p6_state_compatibility_tests|p6_output_stage_tests)$"
      - name: Capture Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a ./build/plugin/P6UiSmoke_artefacts/Release/P6UiSmoke ui-smoke
      - name: Capture Windows
        if: runner.os == 'Windows'
        run: ./build/plugin/P6UiSmoke_artefacts/Release/P6UiSmoke.exe ui-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arp-preview-${{ runner.os }}
          path: ui-smoke/*.png
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: arp-vst3-${{ runner.os }}
          path: build/plugin/P6CorePlugin_artefacts/Release/VST3/
