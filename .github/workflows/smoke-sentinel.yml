name: smoke-sentinel

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/smoke-sentinel.yml'

permissions:
  contents: write

jobs:
  mark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Read smoke result
        shell: bash
        run: |
          rm -f .ci/SMOKE_SUCCESS .ci/SMOKE_FAILURE
          if grep -q '^overall_exit=0$' .ci/linux-vst3-status.txt; then
            echo "Linux JUCE VST3 build + CTest + pluginval strictness 10 passed." > .ci/SMOKE_SUCCESS
          else
            echo "Linux VST3 smoke failed. See .ci/linux-vst3-status.txt." > .ci/SMOKE_FAILURE
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/SMOKE_SUCCESS .ci/SMOKE_FAILURE .ci/linux-vst3-status.txt
          git commit -m "Mark Linux VST3 smoke outcome" || exit 0
          git push
