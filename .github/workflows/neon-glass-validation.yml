name: neon-glass-validation
on:
  push:
    branches: [validate-neon-glass]
permissions:
  contents: read
jobs:
  plugin:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfontconfig1-dev libfreetype6-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxi-dev libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev libegl1-mesa-dev xvfb
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DP6_BUILD_PLUGIN=ON -DP6_FETCH_JUCE=ON -DP6_BUILD_UI_SMOKE=ON
      - name: Build plugin and editor tests
        run: cmake --build build --config Release --target P6UiSmoke P6CorePlugin_VST3 --parallel 2
      - name: Test and capture Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a ./build/plugin/P6UiSmoke_artefacts/Release/P6UiSmoke ui-smoke
      - name: Test and capture Windows
        if: runner.os == 'Windows'
        run: ./build/plugin/P6UiSmoke_artefacts/Release/P6UiSmoke.exe ui-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neon-preview-${{ runner.os }}
          path: ui-smoke/*.png
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: neon-vst3-${{ runner.os }}
          path: build/plugin/P6CorePlugin_artefacts/Release/VST3/
