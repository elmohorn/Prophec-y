name: linux-vst3-smoke

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/linux-smoke.yml'
      - 'CMakeLists.txt'
      - 'include/**'
      - 'src/**'
      - 'plugin/**'
      - 'tests/**'

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install JUCE dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libfontconfig1-dev libfreetype6-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxi-dev \
            libxinerama-dev libxrandr-dev libxrender-dev xvfb

      - name: Build, test and validate while retaining logs
        id: probe
        shell: bash
        run: |
          set +e
          mkdir -p .ci
          STATUS=0

          cmake -S . -B build-smoke \
            -DCMAKE_BUILD_TYPE=Release \
            -DP6_BUILD_PLUGIN=ON \
            -DP6_FETCH_JUCE=ON \
            -DP6_JUCE_TAG=9.0.4 > .ci/configure.log 2>&1
          CONFIG=$?
          [ $CONFIG -eq 0 ] || STATUS=$CONFIG

          if [ $CONFIG -eq 0 ]; then
            cmake --build build-smoke --config Release --target P6CorePlugin_VST3 -j2 > .ci/build.log 2>&1
            BUILD=$?
            [ $BUILD -eq 0 ] || STATUS=$BUILD
          else
            BUILD=99
          fi

          if [ $BUILD -eq 0 ]; then
            ctest --test-dir build-smoke -C Release --output-on-failure > .ci/ctest.log 2>&1
            TESTS=$?
            [ $TESTS -eq 0 ] || STATUS=$TESTS
          else
            TESTS=99
          fi

          PLUGINVAL=99
          VST3=""
          if [ $BUILD -eq 0 ]; then
            VST3="$(find build-smoke -name 'P6 Core.vst3' -print -quit)"
            curl -L -o /tmp/pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Linux.zip > .ci/pluginval-download.log 2>&1
            CURL=$?
            if [ $CURL -eq 0 ]; then
              unzip -q /tmp/pluginval.zip -d /tmp/pluginval
              chmod +x /tmp/pluginval/pluginval
              xvfb-run -a /tmp/pluginval/pluginval --strictness-level 10 --verbose --validate "$VST3" > .ci/pluginval.log 2>&1
              PLUGINVAL=$?
              [ $PLUGINVAL -eq 0 ] || STATUS=$PLUGINVAL
            fi
          fi

          {
            echo "P6 Core v0.15 Linux VST3 smoke"
            echo "commit=$(git rev-parse HEAD)"
            echo "configure_exit=$CONFIG"
            echo "build_exit=$BUILD"
            echo "ctest_exit=$TESTS"
            echo "pluginval_exit=$PLUGINVAL"
            echo "vst3=$VST3"
            echo "overall_exit=$STATUS"
            echo
            echo "--- configure tail ---"
            tail -n 30 .ci/configure.log 2>/dev/null || true
            echo
            echo "--- build tail ---"
            tail -n 50 .ci/build.log 2>/dev/null || true
            echo
            echo "--- ctest ---"
            cat .ci/ctest.log 2>/dev/null || true
            echo
            echo "--- pluginval tail ---"
            tail -n 80 .ci/pluginval.log 2>/dev/null || true
          } > .ci/linux-vst3-status.txt

          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Commit smoke report
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/linux-vst3-status.txt
          git commit -m "Record Linux VST3 smoke result" || exit 0
          git pull --rebase origin main
          git push

      - name: Fail if smoke failed
        if: always()
        shell: bash
        run: exit "${{ steps.probe.outputs.status || 1 }}"
