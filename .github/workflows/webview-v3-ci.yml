name: WebView v3 integration

on:
  push:
    branches: [feature/ui-v3-glass-metal]
  workflow_dispatch:

concurrency:
  group: webview-v3-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-webview:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Verify approved HTML source
        shell: pwsh
        run: |
          $source = 'plugin/ui/web/ProphecY_v3_0.html'
          if (!(Test-Path $source)) { throw 'Approved v3 HTML source missing' }
          $html = Get-Content $source -Raw
          if ($html.Length -lt 100000 -or !$html.Contains('prophecy-native-bridge') -or !$html.Contains('prophecy-glass-panel')) {
            throw 'Approved v3 HTML source is incomplete'
          }
      - name: Validate HTML JavaScript and parameter bridge contracts
        shell: pwsh
        run: python tests/webview_v3_integrity.py
      - name: Install headless browser test dependency
        shell: pwsh
        run: npm install --no-save --no-package-lock playwright-core@1.55.0
      - name: Exercise HTML native bridge in Chromium
        shell: pwsh
        run: node tests/webview_v3_browser.mjs
      - name: Install Microsoft WebView2 SDK (JUCE 9 requirement)
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -Version 1.0.3485.44 -OutputDirectory "$env:RUNNER_TEMP/webview2" -Source https://api.nuget.org/v3/index.json -NonInteractive
          if (!(Test-Path "$env:RUNNER_TEMP/webview2/Microsoft.Web.WebView2.1.0.3485.44/build/native/include/WebView2.h")) {
            throw 'WebView2 SDK header not found after NuGet install'
          }
      - name: Configure JUCE WebView2 VST3
        shell: pwsh
        run: cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release -DP6_BUILD_PLUGIN=ON -DP6_FETCH_JUCE=ON -DP6_USE_WEB_UI=ON "-DJUCE_WEBVIEW2_PACKAGE_LOCATION=$env:RUNNER_TEMP/webview2"
      - name: Compile WebView2 VST3
        shell: pwsh
        run: cmake --build build-web --config Release --target P6CorePlugin_VST3 --parallel 2
      - name: Compile DSP and state regression tests
        shell: pwsh
        run: cmake --build build-web --config Release --target p6core_tests p6_control_contract_tests p6_realtime_contract_tests p6_plugin_state_tests p6_character_tests p6_preset_bank_tests p6_arp_state_tests --parallel 2
      - name: Run DSP and state regression tests
        shell: pwsh
        run: ctest --test-dir build-web -C Release --output-on-failure -R "^(p6core_tests|p6_control_contract_tests|p6_realtime_contract_tests|p6_plugin_state_tests|p6_character_tests|p6_preset_bank_tests|p6_arp_state_tests)$"
      - name: Assert embedded approved HTML in VST3 binary
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          candidates = list(Path("build-web").rglob("Contents/x86_64-win/P6 Core.vst3"))
          assert len(candidates) == 1, f"Expected one VST3 binary; found {len(candidates)}"
          binary = candidates[0].read_bytes()
          for sentinel in (b"prophecy-native-bridge", b"prophecy-glass-panel", b"prophecyHostState"):
              assert sentinel in binary, f"Embedded HTML sentinel missing: {sentinel!r}"
          print(f"Verified embedded v3 HTML in {candidates[0]} ({len(binary)} bytes)")
          '@ | python -
      - name: Upload verified complete WebView VST3
        uses: actions/upload-artifact@v4
        with:
          name: ProphecY-v3-WebView2-Windows-VST3
          path: build-web/**/P6 Core.vst3/**
          if-no-files-found: error
