name: WebView v3 integration

on:
  push:
    branches: [feature/ui-v3-glass-metal]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-webview:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Prepare WebView build-only smoke resource
        id: source
        shell: pwsh
        run: |
          if (!(Test-Path 'plugin/ui/web/ProphecY_v3_0.html')) {
            Write-Warning 'Approved v3 HTML is not yet committed; compiling a bridge smoke resource ONLY.'
            '<!doctype html><html><body><h1>WebView bridge compile smoke only — NOT the approved v3 design</h1></body></html>' | Set-Content 'plugin/ui/web/ProphecY_v3_0.html'
            'SMOKE_ONLY' | Set-Content 'webview-build-mode.txt'
            'approved=false' >> $env:GITHUB_OUTPUT
          } else {
            'APPROVED_HTML' | Set-Content 'webview-build-mode.txt'
            'approved=true' >> $env:GITHUB_OUTPUT
          }
      - name: Configure JUCE WebView2 VST3
        shell: pwsh
        run: cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release -DP6_BUILD_PLUGIN=ON -DP6_FETCH_JUCE=ON -DP6_USE_WEB_UI=ON
      - name: Compile WebView2 VST3
        shell: pwsh
        run: cmake --build build-web --config Release --target P6CorePlugin_VST3 --parallel 2
      - name: Report build mode
        shell: pwsh
        run: Get-Content webview-build-mode.txt
      - name: Upload VST3 only when approved HTML is present
        if: steps.source.outputs.approved == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ProphecY-v3-WebView2-Windows-VST3
          path: build-web/**/P6 Core.vst3/**
          if-no-files-found: error
