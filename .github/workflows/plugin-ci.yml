name: plugin-ci

on:
  workflow_dispatch:
  push:
  pull_request:

concurrency:
  group: plugin-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  online-analysis-tooling:
    name: Online-reference measurement guards
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install analysis dependencies
        run: python3 -m pip install -r analysis/requirements.txt
      - name: Validate native analysis and synthetic measurement guards
        run: |
          python3 -m py_compile tools/compare_online_suite.py tools/prepare_recovered_online_suite.py analysis/*.py
          python3 tests/online_metrics_test.py

  core-sanitizers:
    name: Linux ASan+UBSan
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Configure sanitizer tests
        shell: bash
        run: >-
          cmake -S . -B build-sanitize
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build sanitizer tests
        run: cmake --build build-sanitize --target p6core_tests p6_plugin_state_tests p6_control_contract_tests p6_realtime_contract_tests p6_v018_fx_tests p6_v019_reference_tests p6_render_reference p6_generate_p0a_capture_pack --parallel 2
      - name: Run sanitizer tests
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build-sanitize --output-on-failure
      - name: Reference corpus tooling self-tests
        shell: bash
        run: |
          python3 tools/validate_reference_manifest.py reference_hardware/examples/P0A_manifest.example.json --metadata-only
          python3 tools/render_reference_manifest.py --self-test
          python3 tools/reference_audio_metrics.py --self-test
          python3 tools/analyze_p0a_manifest.py --self-test
      - name: External-prior registry self-test
        shell: bash
        run: |
          python3 -m py_compile tools/render_external_prior_suite.py
          python3 -c "import json; d=json.load(open('calibration/external_priors.json', encoding='utf-8')); assert d['schema_version'] == 1; assert 'phosphor_pw_v019' in d['profiles']"
          printf 'case_id,sysex,events\nSMOKE,dummy.syx,dummy_events.csv\n' > /tmp/external_prior_smoke.csv
          python3 tools/render_external_prior_suite.py /tmp/external_prior_smoke.csv --output-dir /tmp/external-prior-out --dry-run

  build-and-validate:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            pluginval: ./pluginval
          - name: Windows
            os: windows-2022
            pluginval: ./pluginval.exe

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux JUCE dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libfontconfig1-dev libfreetype6-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxi-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libgl1-mesa-dev libegl1-mesa-dev xvfb

      - name: Configure
        shell: bash
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DP6_BUILD_PLUGIN=ON
          -DP6_FETCH_JUCE=ON

      - name: Build VST3, tests and diagnostics
        shell: bash
        run: >-
          cmake --build build --config Release
          --target p6core_tests p6_plugin_state_tests p6_control_contract_tests p6_realtime_contract_tests p6_v018_fx_tests p6_v019_reference_tests p6_render_reference p6_generate_p0a_capture_pack p6_sync_harmonic_probe p6_dsp_fingerprint p6_perf_benchmark P6CorePlugin_VST3
          --parallel 2

      - name: Core, state, control, realtime and FX tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: DSP fingerprint snapshot
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./build/Release/p6_dsp_fingerprint.exe
          else
            ./build/p6_dsp_fingerprint
          fi

      - name: Hard-sync harmonic snapshot
        if: runner.os == 'Linux'
        shell: bash
        run: ./build/p6_sync_harmonic_probe

      - name: Performance snapshot
        if: runner.os == 'Linux'
        shell: bash
        run: ./build/p6_perf_benchmark

      - name: Download pluginval 1.0.4
        shell: bash
        run: |
          curl -L -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_${{ runner.os }}.zip"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z x pluginval.zip
          else
            unzip -q pluginval.zip
            chmod +x "${{ matrix.pluginval }}"
          fi

      - name: Validate VST3
        shell: bash
        run: |
          VST3_PATH="$(find build -name 'P6 Core.vst3' -print -quit)"
          test -n "$VST3_PATH"
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run -a "${{ matrix.pluginval }}" --strictness-level 10 --verbose --validate "$VST3_PATH"
          else
            "${{ matrix.pluginval }}" --strictness-level 10 --verbose --validate "$VST3_PATH"
          fi

      - name: Upload validated VST3
        uses: actions/upload-artifact@v4
        with:
          name: P6-Core-v0.18-${{ runner.os }}-VST3
          path: |
            build/**/P6 Core.vst3
          if-no-files-found: error

