name: header-visual-validation
on:
  push:
    branches: [validate-unified-header]
jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-22.04 }
          - { name: Windows, os: windows-2022 }
    steps:
      - uses: actions/checkout@v7
      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfontconfig1-dev libfreetype6-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxi-dev libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev libegl1-mesa-dev xvfb
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DP6_BUILD_PLUGIN=ON -DP6_FETCH_JUCE=ON -DP6_BUILD_UI_SMOKE=ON
      - name: Build editor and VST
        run: cmake --build build --config Release --target P6UiSmoke P6CorePlugin_VST3 --parallel 2
      - name: Test editor and audio
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run -a ./build/plugin/P6UiSmoke_artefacts/Release/P6UiSmoke ui-smoke
          else
            ./build/plugin/P6UiSmoke_artefacts/Release/P6UiSmoke.exe ui-smoke
          fi
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: Header-preview-${{ runner.os }}
          path: ui-smoke/*.png
          if-no-files-found: error
      - name: Upload VST
        uses: actions/upload-artifact@v4
        with:
          name: P6-header-${{ runner.os }}-VST3
          path: build/**/P6 Core.vst3
          if-no-files-found: error
