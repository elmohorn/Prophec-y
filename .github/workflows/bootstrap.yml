name: Bootstrap v0.15 runtime source tree

on:
  push:
    paths:
      - '.bootstrap/runtime-part-*'
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify runtime archive
        run: |
          cat .bootstrap/runtime-part-* > /tmp/runtime.b64
          base64 -d /tmp/runtime.b64 > /tmp/runtime.tar.xz
          echo "f50ac3492af516611a52516c396fbb5f84d9550132a3ea4b68d2f83ecc8ffa08  /tmp/runtime.tar.xz" | sha256sum -c -
          xz -t /tmp/runtime.tar.xz
          tar -tJf /tmp/runtime.tar.xz > /tmp/runtime-files.txt
          echo "Runtime archive entries:"
          wc -l /tmp/runtime-files.txt
          tar -xJf /tmp/runtime.tar.xz -C .

      - name: Keep workflow changes out of the bootstrap commit
        run: |
          rm -rf .bootstrap
          rm -f .github/workflows/plugin-ci.yml
          git checkout -- .github/workflows/bootstrap.yml

      - name: Commit imported project tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Import validated P6 Core v0.15 runtime source tree"
          git push
